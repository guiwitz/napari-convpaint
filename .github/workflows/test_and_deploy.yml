# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on: 
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      id-token: write  # needed for codecov OIDC authentication
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        group:
          - name: conv-paint suite
            files: "src/napari_convpaint/_tests/test_convpaint.py src/napari_convpaint/_tests/test_utils.py"
          - name: dims suite
            files: "src/napari_convpaint/_tests/test_dims.py"
        # All other test files (new ones included automatically), once per OS to keep the run short
        include:
          - platform: ubuntu-latest
            python-version: "3.13"
            group:
              name: remaining tests
              files: "src/napari_convpaint/_tests --ignore=src/napari_convpaint/_tests/test_convpaint.py --ignore=src/napari_convpaint/_tests/test_utils.py --ignore=src/napari_convpaint/_tests/test_dims.py"
          - platform: windows-latest
            python-version: "3.13"
            group:
              name: remaining tests
              files: "src/napari_convpaint/_tests --ignore=src/napari_convpaint/_tests/test_convpaint.py --ignore=src/napari_convpaint/_tests/test_utils.py --ignore=src/napari_convpaint/_tests/test_dims.py"
          - platform: macos-latest
            python-version: "3.13"
            group:
              name: remaining tests
              files: "src/napari_convpaint/_tests --ignore=src/napari_convpaint/_tests/test_convpaint.py --ignore=src/napari_convpaint/_tests/test_utils.py --ignore=src/napari_convpaint/_tests/test_dims.py"
    steps:
      - uses: actions/checkout@v6

      - name: Setup python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
      - name: Install Windows OpenGL
        uses: pyvista/setup-headless-display-action@v4.2
        with:
          qt: true
          wm: herbstluftwm

      - name: Install Visual C++ Redistributable (Windows Only)
        if: runner.os == 'Windows'
        run: choco install vcredist140 --no-progress


      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        # tox 4.67.14 removed a name that tox-gh-actions (3.5.0) imports; unpin once they fit again
        run: uvx --from "tox<4.67.14" --with tox-gh-actions tox -- ${{ matrix.group.files }}
        env:
          PLATFORM: ${{ matrix.platform }}
          CONVPAINT_SKIP_MPS_CLEANUP: "1"

      - name: Coverage
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true  # reliable tokenless codecov uploads

  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: hynek/build-and-inspect-python-package@v2

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your twine API key in your
    # github secrets (see readme for details)
    needs: [test, build-and-inspect-package]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    permissions:
      id-token: write # Publish to PyPI without a token
      contents: write # Create the GitHub release (a permissions block drops every scope it omits)
    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@v7
        with:
          name: Packages
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: './dist/*'
